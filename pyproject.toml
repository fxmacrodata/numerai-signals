[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fxmacrodata-numerai"
version = "0.1.0"
description = "Point-in-time central-bank and macro features for the Numerai Signals stock universe, from FXMacroData"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "FXMacroData", email = "info@fxmacrodata.com" }]
keywords = ["numerai", "numerai-signals", "macroeconomics", "point-in-time", "central-bank", "quant", "features"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["pandas>=1.5", "requests>=2.28"]

[project.optional-dependencies]
parquet = ["pyarrow>=10"]
dev = ["pytest>=7", "pyarrow>=10"]

[project.scripts]
fxmd-numerai = "fxmacrodata_numerai.cli:main"

[project.urls]
Homepage = "https://fxmacrodata.com/?utm_source=pypi&utm_medium=package&utm_campaign=numerai-signals&utm_content=project-homepage"
Documentation = "https://fxmacrodata.com/documentation/reference?utm_source=pypi&utm_medium=package&utm_campaign=numerai-signals&utm_content=project-docs"
Repository = "https://github.com/fxmacrodata/numerai-signals"

[tool.hatch.build.targets.wheel]
packages = ["fxmacrodata_numerai"]

[tool.hatch.build.targets.sdist]
include = ["fxmacrodata_numerai", "tests", "examples", "README.md", "LICENSE"]
